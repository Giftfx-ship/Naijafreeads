<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | NaijaMarket</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #0a0c15; color: #f1f5f9; padding: 24px; }
        .admin-header { background: linear-gradient(135deg, #1a1a2e, #16213e); padding: 28px 36px; border-radius: 28px; margin-bottom: 30px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 20px; border: 1px solid #e65c00; }
        .admin-header h1 { font-size: 28px; display: flex; align-items: center; gap: 15px; }
        .stats-badge { background: rgba(230,92,0,0.2); padding: 12px 28px; border-radius: 60px; border: 1px solid #e65c00; }
        .controls { display: flex; gap: 15px; margin-bottom: 30px; flex-wrap: wrap; }
        .search-box { flex: 1; padding: 14px 24px; background: #1e293b; border: 1px solid #334155; border-radius: 60px; color: white; outline: none; }
        .refresh-btn, .export-btn, .clear-btn { padding: 14px 28px; border-radius: 60px; color: white; font-weight: 600; cursor: pointer; border: none; }
        .refresh-btn { background: #3b82f6; }
        .export-btn { background: #e65c00; }
        .clear-btn { background: #ef4444; }
        .data-container { display: flex; flex-direction: column; gap: 24px; max-height: calc(100vh - 250px); overflow-y: auto; }
        .data-container::-webkit-scrollbar { width: 8px; }
        .data-container::-webkit-scrollbar-track { background: #1e293b; border-radius: 10px; }
        .data-container::-webkit-scrollbar-thumb { background: #e65c00; border-radius: 10px; }
        .data-card { background: #13132a; border-radius: 24px; padding: 24px; border-left: 6px solid #e65c00; margin-bottom: 16px; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; padding-bottom: 12px; border-bottom: 1px solid #2d3a5e; }
        .badge { padding: 6px 18px; border-radius: 40px; font-size: 12px; font-weight: 700; }
        .badge-ad { background: #22c55e; color: #000; }
        .badge-location { background: #8b5cf6; color: #fff; }
        .delete-btn { background: #ef4444; border: none; padding: 6px 18px; border-radius: 40px; color: white; cursor: pointer; }
        .info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 15px; margin: 15px 0; }
        .info-card { background: rgba(0,0,0,0.35); padding: 14px; border-radius: 16px; }
        .info-label { font-size: 11px; color: #94a3b8; text-transform: uppercase; margin-bottom: 6px; }
        .info-value { font-size: 14px; font-weight: 500; word-break: break-word; }
        .location-box { background: rgba(230,92,0,0.1); padding: 18px; border-radius: 20px; margin-top: 15px; border: 1px solid rgba(230,92,0,0.3); }
        .empty-state { text-align: center; padding: 80px; color: #64748b; }
        @media (max-width: 768px) { .info-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="admin-header">
        <h1><i class="fas fa-chart-line"></i> NaijaMarket — Admin Dashboard</h1>
        <div class="stats-badge"><i class="fas fa-database"></i> <span id="recordCount">0</span> Records</div>
    </div>
    <div class="controls">
        <input type="text" class="search-box" id="searchInput" placeholder="🔍 Search by title, street, city, phone, IP...">
        <button class="refresh-btn" id="refreshBtn"><i class="fas fa-sync-alt"></i> Refresh</button>
        <button class="export-btn" id="exportBtn"><i class="fas fa-download"></i> Export JSON</button>
        <button class="clear-btn" id="clearBtn"><i class="fas fa-trash-alt"></i> Clear All</button>
    </div>
    <div class="data-container" id="dataContainer"><div class="empty-state"><i class="fas fa-spinner fa-pulse"></i> Loading...</div></div>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const ADMIN_SECRET = "NAIJA2025DOPE";
        if (urlParams.get("key") !== ADMIN_SECRET) {
            document.body.innerHTML = `<div style="display:flex;justify-content:center;align-items:center;height:100vh;"><div style="text-align:center;background:#1e293b;padding:50px;border-radius:40px;"><i class="fas fa-lock" style="font-size:70px;color:#ef4444;"></i><h2>Access Denied</h2></div></div>`;
            throw new Error("Unauthorized");
        }
        let allRecords = [];
        async function loadData() {
            try {
                const res = await fetch('/api/fetch');
                if (res.ok) { const data = await res.json(); allRecords = data.records || []; }
                else throw new Error();
            } catch(err) {
                const stored = localStorage.getItem('naijamarket_data');
                allRecords = stored ? JSON.parse(stored) : [];
            }
            renderData();
        }
        function renderData() {
            const container = document.getElementById('dataContainer');
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            document.getElementById('recordCount').innerText = allRecords.length;
            let filtered = allRecords.filter(r => {
                if (r.type === 'ad_posted') {
                    return (r.ad.title || '').toLowerCase().includes(searchTerm) ||
                        (r.ad.streetAddress || '').toLowerCase().includes(searchTerm) ||
                        (r.ad.cityArea || '').toLowerCase().includes(searchTerm) ||
                        (r.ad.phone || '').toLowerCase().includes(searchTerm) ||
                        (r.gpsLocation?.city || '').toLowerCase().includes(searchTerm) ||
                        (r.gpsLocation?.state || '').toLowerCase().includes(searchTerm);
                }
                return false;
            });
            if (filtered.length === 0) { container.innerHTML = '<div class="empty-state"><i class="fas fa-inbox"></i> No data</div>'; return; }
            container.innerHTML = filtered.map(r => `
                <div class="data-card">
                    <div class="card-header">
                        <div><span class="badge badge-ad"><i class="fas fa-ad"></i> AD POSTED</span><span style="margin-left:12px;font-size:12px;color:#64748b;">${new Date(r.timestamp).toLocaleString()}</span></div>
                        <button class="delete-btn" onclick="deleteRecord(${r.id})"><i class="fas fa-trash"></i> Delete</button>
                    </div>
                    <div class="info-grid">
                        <div class="info-card"><div class="info-label">Category</div><div class="info-value">${escapeHtml(r.ad.category)}</div></div>
                        <div class="info-card"><div class="info-label">Title</div><div class="info-value"><strong>${escapeHtml(r.ad.title)}</strong></div></div>
                        <div class="info-card"><div class="info-label">Price</div><div class="info-value">${escapeHtml(r.ad.price)}</div></div>
                    </div>
                    <div class="info-card"><div class="info-label">Description</div><div class="info-value">${escapeHtml((r.ad.description || '').substring(0, 200))}</div></div>
                    <div class="location-box">
                        <div class="info-label" style="margin-bottom:10px;">📍 ADDRESS INFORMATION</div>
                        <div class="info-grid">
                            <div class="info-card"><div class="info-label">Street Address</div><div class="info-value"><strong>${escapeHtml(r.ad.streetAddress || 'Not provided')}</strong></div></div>
                            <div class="info-card"><div class="info-label">City/Area</div><div class="info-value">${escapeHtml(r.ad.cityArea || 'Not provided')}</div></div>
                            <div class="info-card"><div class="info-label">Phone</div><div class="info-value">${escapeHtml(r.ad.phone || 'Not provided')}</div></div>
                        </div>
                    </div>
                    ${r.gpsLocation ? `
                    <div class="location-box">
                        <div class="info-label" style="margin-bottom:10px;">📍 GPS LOCATION CAPTURED</div>
                        <div class="info-grid">
                            <div class="info-card"><div class="info-label">City (GPS)</div><div class="info-value">${escapeHtml(r.gpsLocation.city || 'N/A')}</div></div>
                            <div class="info-card"><div class="info-label">State (GPS)</div><div class="info-value">${escapeHtml(r.gpsLocation.state || 'N/A')}</div></div>
                            <div class="info-card"><div class="info-label">Country</div><div class="info-value">${escapeHtml(r.gpsLocation.country || 'N/A')}</div></div>
                            <div class="info-card"><div class="info-label">Postcode</div><div class="info-value">${escapeHtml(r.gpsLocation.postcode || 'N/A')}</div></div>
                            <div class="info-card"><div class="info-label">GPS Coordinates</div><div class="info-value">${r.gpsLocation.lat || 'N/A'}, ${r.gpsLocation.lng || 'N/A'}</div></div>
                            <div class="info-card"><div class="info-label">Accuracy</div><div class="info-value">${r.gpsLocation.accuracy || 'N/A'} meters</div></div>
                        </div>
                    </div>
                    ` : ''}
                    <div class="info-grid">
                        <div class="info-card"><div class="info-label">IP Address</div><div class="info-value">${r.device?.ip || r.ip || 'N/A'}</div></div>
                        <div class="info-card"><div class="info-label">Device</div><div class="info-value">${r.device?.platform || 'N/A'}</div></div>
                        <div class="info-card"><div class="info-label">Browser/OS</div><div class="info-value">${(r.device?.userAgent || '').substring(0, 80)}...</div></div>
                    </div>
                </div>
            `).join('');
        }
        function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m])); }
        async function deleteRecord(id) { if (confirm('Delete?')) { try { await fetch(`/api/delete/${id}`, { method: 'DELETE' }); } catch(e) {} allRecords = allRecords.filter(r => r.id !== id); localStorage.setItem('naijamarket_data', JSON.stringify(allRecords)); renderData(); } }
        async function clearAllData() { if (confirm('DELETE ALL?')) { try { await fetch('/api/clear', { method: 'DELETE' }); } catch(e) {} localStorage.removeItem('naijamarket_data'); allRecords = []; renderData(); alert('Cleared'); } }
        function exportData() { const dataStr = JSON.stringify(allRecords, null, 2); const blob = new Blob([dataStr], { type: 'application/json' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `naijamarket-${new Date().toISOString()}.json`; a.click(); }
        document.getElementById('refreshBtn').onclick = loadData;
        document.getElementById('clearBtn').onclick = clearAllData;
        document.getElementById('exportBtn').onclick = exportData;
        document.getElementById('searchInput').oninput = renderData;
        loadData();
        setInterval(loadData, 5000);
    </script>
</body>
</html>
