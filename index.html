<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>NaijaFreeAds | Join Nigeria's #1 Marketplace</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #2e1065 100%);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }
        
        /* Animated Particles */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
        }
        .particle {
            position: absolute;
            background: rgba(255,255,255,0.1);
            border-radius: 50%;
            animation: float 20s infinite;
        }
        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100vh) rotate(720deg); opacity: 0; }
        }
        
        .container {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        /* Glassmorphism Card */
        .auth-card {
            background: rgba(255,255,255,0.98);
            backdrop-filter: blur(10px);
            border-radius: 48px;
            padding: 48px;
            max-width: 520px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.2);
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(50px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        
        .logo { text-align: center; margin-bottom: 32px; }
        .logo-icon {
            font-size: 60px;
            display: inline-block;
            animation: bounce 2s infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .logo-text {
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(135deg, #667eea, #764ba2, #f093fb);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-top: 8px;
        }
        .tagline {
            text-align: center;
            color: #64748b;
            font-size: 14px;
            margin-top: 8px;
        }
        
        /* Tabs */
        .auth-tabs {
            display: flex;
            gap: 16px;
            margin-bottom: 32px;
            background: #f1f5f9;
            padding: 8px;
            border-radius: 60px;
        }
        .auth-tab {
            flex: 1;
            text-align: center;
            padding: 12px;
            cursor: pointer;
            font-weight: 700;
            color: #64748b;
            transition: 0.3s;
            border-radius: 40px;
        }
        .auth-tab.active {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            box-shadow: 0 4px 15px rgba(102,126,234,0.3);
        }
        
        .auth-form { display: none; }
        .auth-form.active { display: block; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
            color: #334155;
        }
        .form-group input {
            width: 100%;
            padding: 14px 16px;
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 20px;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
        }
        .form-group input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
        }
        
        .auth-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            border-radius: 40px;
            color: white;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            margin-top: 8px;
            transition: 0.3s;
            position: relative;
            overflow: hidden;
        }
        .auth-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: 0.5s;
        }
        .auth-btn:hover::before { left: 100%; }
        .auth-btn:hover { transform: translateY(-3px); box-shadow: 0 10px 30px -8px rgba(102,126,234,0.5); }
        
        .forgot-link { text-align: center; margin-top: 20px; }
        .forgot-link a { color: #667eea; text-decoration: none; font-size: 13px; cursor: pointer; font-weight: 500; }
        .switch-link { text-align: center; margin-top: 24px; color: #64748b; font-size: 14px; }
        .switch-link a { color: #667eea; text-decoration: none; font-weight: 700; cursor: pointer; }
        
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: white;
            padding: 14px 28px;
            border-radius: 60px;
            transform: translateX(200%);
            transition: 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 1000;
            font-weight: 600;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.2);
        }
        .toast.show { transform: translateX(0); }
        .toast.error { background: linear-gradient(135deg, #ef4444, #dc2626); }
        
        /* Modal */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(12px);
            z-index: 2000;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: white;
            border-radius: 40px;
            padding: 40px;
            max-width: 450px;
            width: 100%;
            text-align: center;
            animation: modalPop 0.3s ease;
        }
        @keyframes modalPop {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
        .modal-content input {
            width: 100%;
            padding: 14px;
            border: 2px solid #e2e8f0;
            border-radius: 20px;
            margin: 16px 0;
            font-size: 15px;
        }
        .modal-btn {
            padding: 12px 24px;
            border-radius: 40px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            margin: 8px;
        }
        
        @media (max-width: 640px) {
            .auth-card { padding: 32px 24px; margin: 16px; }
            .logo-text { font-size: 24px; }
        }
    </style>
</head>
<body>

<div class="particles" id="particles"></div>

<div class="container">
    <div class="auth-card">
        <div class="logo">
            <div class="logo-icon">🇳🇬</div>
            <div class="logo-text">NaijaFreeAds</div>
            <div class="tagline">Nigeria's #1 Free Marketplace</div>
        </div>
        
        <div class="auth-tabs">
            <div class="auth-tab active" data-tab="login">Login</div>
            <div class="auth-tab" data-tab="signup">Create Account</div>
        </div>
        
        <!-- Login Form -->
        <div class="auth-form active" id="loginForm">
            <div class="form-group">
                <label><i class="fas fa-envelope"></i> Email Address</label>
                <input type="email" id="loginEmail" placeholder="you@example.com">
            </div>
            <div class="form-group">
                <label><i class="fas fa-lock"></i> Password</label>
                <input type="password" id="loginPassword" placeholder="Enter your password">
            </div>
            <button class="auth-btn" id="loginBtn"><i class="fas fa-arrow-right-to-bracket"></i> Login</button>
            <div class="forgot-link"><a onclick="showForgotModal()"><i class="fas fa-key"></i> Forgot Password?</a></div>
        </div>
        
        <!-- Sign Up Form -->
        <div class="auth-form" id="signupForm">
            <div class="form-group">
                <label><i class="fas fa-user"></i> Full Name</label>
                <input type="text" id="signupName" placeholder="John Doe">
            </div>
            <div class="form-group">
                <label><i class="fas fa-envelope"></i> Email Address</label>
                <input type="email" id="signupEmail" placeholder="you@example.com">
            </div>
            <div class="form-group">
                <label><i class="fas fa-phone"></i> Phone Number</label>
                <input type="tel" id="signupPhone" placeholder="0803 123 4567">
            </div>
            <div class="form-group">
                <label><i class="fas fa-lock"></i> Password</label>
                <input type="password" id="signupPassword" placeholder="Min. 6 characters">
            </div>
            <div class="form-group">
                <label><i class="fas fa-check-circle"></i> Confirm Password</label>
                <input type="password" id="signupConfirm" placeholder="Confirm your password">
            </div>
            <div class="form-group">
                <label><i class="fas fa-question-circle"></i> Security Question</label>
                <input type="text" id="securityQuestion" placeholder="e.g., What is your mother's maiden name?">
            </div>
            <div class="form-group">
                <label><i class="fas fa-key"></i> Security Answer</label>
                <input type="text" id="securityAnswer" placeholder="Your answer (case insensitive)">
            </div>
            <button class="auth-btn" id="signupBtn"><i class="fas fa-user-plus"></i> Create Free Account</button>
        </div>
        
        <div class="switch-link">
            <span id="switchText">Don't have an account? </span><a id="switchLink">Sign up free</a>
        </div>
    </div>
</div>

<!-- Forgot Password Modal -->
<div class="modal" id="forgotModal">
    <div class="modal-content">
        <i class="fas fa-shield-alt" style="font-size: 55px; color: #667eea;"></i>
        <h3 style="margin: 16px 0;">Reset Password</h3>
        <p style="color: #64748b;">Enter your email to verify identity</p>
        <input type="email" id="resetEmail" placeholder="Your email address">
        <button class="modal-btn" id="verifyEmailBtn" style="background: linear-gradient(135deg, #667eea, #764ba2); color: white;">Verify Email</button>
    </div>
</div>

<!-- Security Question Modal -->
<div class="modal" id="securityModal">
    <div class="modal-content">
        <i class="fas fa-question-circle" style="font-size: 55px; color: #f59e0b;"></i>
        <h3 style="margin: 16px 0;">Security Verification</h3>
        <p style="color: #64748b;" id="securityQuestionDisplay"></p>
        <input type="text" id="securityAnswerInput" placeholder="Your answer">
        <button class="modal-btn" id="verifyAnswerBtn" style="background: linear-gradient(135deg, #667eea, #764ba2); color: white;">Verify</button>
        <button class="modal-btn" onclick="closeModals()" style="background: #e2e8f0;">Cancel</button>
    </div>
</div>

<!-- Reset Password Modal -->
<div class="modal" id="resetModal">
    <div class="modal-content">
        <i class="fas fa-key" style="font-size: 55px; color: #22c55e;"></i>
        <h3 style="margin: 16px 0;">Set New Password</h3>
        <input type="password" id="newPassword" placeholder="New password (min 6 chars)">
        <input type="password" id="confirmPassword" placeholder="Confirm new password">
        <button class="modal-btn" id="resetPasswordBtn" style="background: linear-gradient(135deg, #22c55e, #16a34a); color: white;">Reset Password</button>
        <button class="modal-btn" onclick="closeModals()" style="background: #e2e8f0;">Cancel</button>
    </div>
</div>

<div class="toast" id="toast">✅ Success!</div>

<script>
    // Create particles
    for (let i = 0; i < 50; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        particle.style.width = Math.random() * 8 + 2 + 'px';
        particle.style.height = particle.style.width;
        particle.style.left = Math.random() * 100 + '%';
        particle.style.animationDuration = Math.random() * 20 + 10 + 's';
        particle.style.animationDelay = Math.random() * 10 + 's';
        document.getElementById('particles').appendChild(particle);
    }
    
    // Tab switching
    document.querySelectorAll('.auth-tab').forEach(tab => {
        tab.addEventListener('click', () => {
            document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            const tabName = tab.dataset.tab;
            document.getElementById('loginForm').classList.toggle('active', tabName === 'login');
            document.getElementById('signupForm').classList.toggle('active', tabName === 'signup');
            document.getElementById('switchText').innerHTML = tabName === 'login' ? "Don't have an account? " : "Already have an account? ";
            document.getElementById('switchLink').innerHTML = tabName === 'login' ? "Sign up free" : "Login here";
        });
    });
    
    document.getElementById('switchLink').addEventListener('click', () => {
        const isLogin = document.getElementById('loginForm').classList.contains('active');
        if (isLogin) {
            document.querySelector('.auth-tab[data-tab="signup"]').click();
        } else {
            document.querySelector('.auth-tab[data-tab="login"]').click();
        }
    });
    
    function showToast(msg, isError = false) {
        const toast = document.getElementById('toast');
        toast.innerHTML = `<i class="fas ${isError ? 'fa-exclamation-triangle' : 'fa-check-circle'}"></i> ${msg}`;
        toast.className = isError ? 'toast error' : 'toast';
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 3000);
    }
    
    // Sign Up
    document.getElementById('signupBtn').addEventListener('click', () => {
        const fullname = document.getElementById('signupName').value.trim();
        const email = document.getElementById('signupEmail').value.trim();
        const phone = document.getElementById('signupPhone').value.trim();
        const password = document.getElementById('signupPassword').value;
        const confirm = document.getElementById('signupConfirm').value;
        const securityQuestion = document.getElementById('securityQuestion').value.trim();
        const securityAnswer = document.getElementById('securityAnswer').value.trim().toLowerCase();
        
        if (!fullname || !email || !phone || !password || !securityQuestion || !securityAnswer) {
            showToast("Please fill all fields", true);
            return;
        }
        if (password !== confirm) {
            showToast("Passwords don't match", true);
            return;
        }
        if (password.length < 6) {
            showToast("Password must be at least 6 characters", true);
            return;
        }
        if (!email.includes('@')) {
            showToast("Enter valid email", true);
            return;
        }
        
        let users = JSON.parse(localStorage.getItem('naija_users') || '[]');
        if (users.find(u => u.email === email)) {
            showToast("Email already registered", true);
            return;
        }
        
        const newUser = {
            id: Date.now(),
            fullname,
            email,
            phone,
            password,
            securityQuestion,
            securityAnswer,
            createdAt: new Date().toISOString(),
            avatar: `https://ui-avatars.com/api/?name=${encodeURIComponent(fullname)}&background=667eea&color=fff&length=2&rounded=true&bold=true&size=80`
        };
        
        users.push(newUser);
        localStorage.setItem('naija_users', JSON.stringify(users));
        localStorage.setItem('currentUser', JSON.stringify(newUser));
        
        showToast("🎉 Account created successfully!");
        setTimeout(() => {
            window.location.href = 'dashboard.html';
        }, 1500);
    });
    
    // Login
    document.getElementById('loginBtn').addEventListener('click', () => {
        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value;
        
        if (!email || !password) {
            showToast("Please enter email and password", true);
            return;
        }
        
        let users = JSON.parse(localStorage.getItem('naija_users') || '[]');
        const user = users.find(u => u.email === email && u.password === password);
        
        if (user) {
            localStorage.setItem('currentUser', JSON.stringify(user));
            showToast("✅ Login successful!");
            setTimeout(() => {
                window.location.href = 'dashboard.html';
            }, 1000);
        } else {
            showToast("Invalid email or password", true);
        }
    });
    
    // Forgot Password Flow
    let resetUser = null;
    
    function showForgotModal() {
        document.getElementById('forgotModal').classList.add('active');
    }
    
    document.getElementById('verifyEmailBtn').addEventListener('click', () => {
        const email = document.getElementById('resetEmail').value.trim();
        if (!email) {
            showToast("Enter your email", true);
            return;
        }
        
        let users = JSON.parse(localStorage.getItem('naija_users') || '[]');
        resetUser = users.find(u => u.email === email);
        
        if (resetUser) {
            document.getElementById('forgotModal').classList.remove('active');
            document.getElementById('securityQuestionDisplay').innerText = resetUser.securityQuestion;
            document.getElementById('securityModal').classList.add('active');
        } else {
            showToast("Email not found", true);
        }
    });
    
    document.getElementById('verifyAnswerBtn').addEventListener('click', () => {
        const answer = document.getElementById('securityAnswerInput').value.trim().toLowerCase();
        if (answer === resetUser.securityAnswer) {
            document.getElementById('securityModal').classList.remove('active');
            document.getElementById('resetModal').classList.add('active');
        } else {
            showToast("Incorrect security answer", true);
        }
    });
    
    document.getElementById('resetPasswordBtn').addEventListener('click', () => {
        const newPass = document.getElementById('newPassword').value;
        const confirmPass = document.getElementById('confirmPassword').value;
        
        if (!newPass || !confirmPass) {
            showToast("Please enter new password", true);
            return;
        }
        if (newPass !== confirmPass) {
            showToast("Passwords don't match", true);
            return;
        }
        if (newPass.length < 6) {
            showToast("Password must be at least 6 characters", true);
            return;
        }
        
        let users = JSON.parse(localStorage.getItem('naija_users') || '[]');
        const userIndex = users.findIndex(u => u.id === resetUser.id);
        if (userIndex !== -1) {
            users[userIndex].password = newPass;
            localStorage.setItem('naija_users', JSON.stringify(users));
            showToast("✅ Password reset successfully!");
            closeModals();
            document.getElementById('loginPassword').value = '';
        }
    });
    
    function closeModals() {
        document.getElementById('forgotModal').classList.remove('active');
        document.getElementById('securityModal').classList.remove('active');
        document.getElementById('resetModal').classList.remove('active');
        document.getElementById('resetEmail').value = '';
        document.getElementById('securityAnswerInput').value = '';
        document.getElementById('newPassword').value = '';
        document.getElementById('confirmPassword').value = '';
        resetUser = null;
    }
    
    window.showForgotModal = showForgotModal;
    window.closeModals = closeModals;
</script>
</body>
</html>
